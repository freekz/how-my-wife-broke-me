<!doctype html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b101b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
  <title>How my Wife broke me</title>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand-mark">W<span>€</span></div>
      <div class="brand-copy"><span class="eyebrow">MY MONEY JOURNAL</span><strong>How my Wife <em>broke me</em></strong></div>
      <span class="offline-indicator" id="connection" title="Работи локално">●</span>

    <main id="page" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><small>Начало</small></button>
      <button class="nav-btn" data-page="transactions"><span class="nav-icon">⇄</span><small>Операции</small></button>
      <button class="add-nav" id="add-transaction" aria-label="Нова операция">+</button>
      <button class="nav-btn" data-page="accounts"><span class="nav-icon">▣</span><small>Сметки</small></button>
      <button class="nav-btn" data-page="reports"><span class="nav-icon">▥</span><small>Справки</small></button>
    </nav>
  </div>
  <dialog id="editor" class="editor">
    <form id="editor-form" method="dialog" novalidate>
      <div class="dialog-head"><div><span class="eyebrow">HOW MY WIFE BROKE ME</span><h2 id="dialog-title">Нова операция</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="Затвори">✕</button></div>
      <div id="editor-fields"></div>
      <div class="dialog-actions"><button type="button" class="ghost danger" id="delete-item" hidden>Изтрий</button><button type="submit" class="primary">Запази</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>

</html>
